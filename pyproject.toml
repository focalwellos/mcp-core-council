[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-core-council"
version = "0.6.5"
description = "MCP-core council client: runs review-council seats on your own Claude, Codex or Antigravity subscription"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcp-core-council = "mcp_core_council.cli:main"
council-local = "mcp_core_council.council_local:main"

[tool.setuptools]
packages = ["mcp_core_council"]
